name: Integration Tests (PostgreSQL)

concurrency:
  group: pg-integration-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'plugins/postgres-plugin/**'
      - '.github/workflows/pg-integration.yml'
      - 'tests/fixtures/**'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'plugins/postgres-plugin/**'
      - '.github/workflows/pg-integration.yml'
      - 'tests/fixtures/**'

jobs:
  test-postgres:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        ports:
          - 54320:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Seed PostgreSQL databases
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          bash tests/fixtures/seed_postgres.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            plugins/postgres-plugin/target
          key: ${{ runner.os }}-cargo-pg-${{ hashFiles('src-tauri/Cargo.lock', 'plugins/postgres-plugin/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pg-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build PostgreSQL plugin
        run: cargo build --release --manifest-path plugins/postgres-plugin/Cargo.toml

      - name: Run PostgreSQL integration tests
        working-directory: src-tauri
        env:
          RUST_TEST_THREADS: "1"
          REGENERATE_GOLDEN: "1"
        run: cargo test --test postgres_integration -- --include-ignored

      - name: Run parity tests (plugin vs builtin)
        working-directory: src-tauri
        continue-on-error: true
        env:
          RUST_TEST_THREADS: "1"
          POSTGRES_PLUGIN_BIN: ${{ github.workspace }}/plugins/postgres-plugin/target/release/postgresql-plugin
        run: cargo test --test postgres_integration parity -- --include-ignored

      - name: Upload golden files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-files
          path: src-tauri/tests/postgres_integration/golden/
